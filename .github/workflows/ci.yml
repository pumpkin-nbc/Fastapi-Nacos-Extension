name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check fastapi_nacos_extension tests examples scripts
      - run: python -m mypy fastapi_nacos_extension
      - run: python -m compileall -q fastapi_nacos_extension tests examples scripts
      - run: python -m pip check
      - run: python scripts/check_versions.py
      - run: python -m pytest

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8: retain the original FastAPI/Nacos SDK cross-product.
          - python: "3.8"
            fastapi: "0.112.2"
            nacos-sdk: "2.0.0"
          - python: "3.8"
            fastapi: "0.112.2"
            nacos-sdk: "2.0.11"
          - python: "3.8"
            fastapi: "0.124.4"
            nacos-sdk: "2.0.0"
          - python: "3.8"
            fastapi: "0.124.4"
            nacos-sdk: "2.0.11"
          # FastAPI 0.125.0 dropped Python 3.8; 0.128.8 is the Python 3.9 ceiling.
          - python: "3.9"
            fastapi: "0.125.0"
            nacos-sdk: "2.0.11"
          - python: "3.9"
            fastapi: "0.128.8"
            nacos-sdk: "2.0.11"
          # FastAPI 0.129.0+ requires Python 3.10 or newer.
          - python: "3.10"
            fastapi: "0.129.0"
            nacos-sdk: "2.0.11"
          - python: "3.10"
            fastapi: "0.141.1"
            nacos-sdk: "2.0.11"
          # Exercise every newer supported Python minor against the latest tested FastAPI.
          - python: "3.11"
            fastapi: "0.141.1"
            nacos-sdk: "2.0.11"
          - python: "3.12"
            fastapi: "0.141.1"
            nacos-sdk: "2.0.11"
          - python: "3.13"
            fastapi: "0.141.1"
            nacos-sdk: "2.0.11"
          - python: "3.14"
            fastapi: "0.141.1"
            nacos-sdk: "2.0.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e ".[test]"
          "fastapi==${{ matrix.fastapi }}"
          "nacos-sdk-python==${{ matrix.nacos-sdk }}"
      - run: python -m compileall -q fastapi_nacos_extension tests
      - run: python -m pip check
      - run: python -m pytest
      - run: python -c "import fastapi, nacos, fastapi_nacos_extension; print(fastapi.__version__, nacos.__file__, fastapi_nacos_extension.__version__)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2,<2" "twine>=5,<6" "tomli>=2,<3"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_archives.py
      - run: python -m venv .smoke-venv
      - run: .smoke-venv/bin/python -m pip install dist/fastapi_nacos_extension-0.1.0-py3-none-any.whl
      - run: .smoke-venv/bin/python scripts/smoke_import.py
      - uses: actions/upload-artifact@v4
        with:
          name: fastapi-nacos-extension-0.1.0
          path: dist/*

  required-ci:
    runs-on: ubuntu-latest
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - compatibility
      - build
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
