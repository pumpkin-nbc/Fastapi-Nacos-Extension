[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "fastapi-nacos"
version = "0.1.0"
description = "A production-oriented FastAPI extension for Nacos 2.x service discovery and configuration."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Pumpkin", email = "a760329881@gmail.com" }
]
keywords = ["fastapi", "nacos", "service-discovery", "configuration", "microservices"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Typing :: Typed",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.112.2,<0.125.0",
  "nacos-sdk-python>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<8.4",
  "pytest-cov>=4.0,<6.0",
  "httpx>=0.27,<0.29",
  "ruff>=0.5,<0.15",
  "mypy>=1.0,<1.15",
  "build>=1.2,<2.0",
  "twine>=5.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/pumpkin-nbc/Fastapi-Nacos"
Repository = "https://github.com/pumpkin-nbc/Fastapi-Nacos"
Documentation = "https://github.com/pumpkin-nbc/Fastapi-Nacos/tree/master/docs"
Issues = "https://github.com/pumpkin-nbc/Fastapi-Nacos/issues"
Changelog = "https://github.com/pumpkin-nbc/Fastapi-Nacos/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_nacos"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"
include = [
  "/fastapi_nacos",
  "/tests",
  "/examples",
  "/scripts",
  "/docs",
  "/README.md",
  "/README.zh-CN.md",
  "/CHANGELOG.md",
  "/CHANGELOG.zh-CN.md",
  "/SECURITY.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fastapi_nacos --cov-report=term-missing"
markers = [
  "integration: opt-in tests requiring an external non-production Nacos server",
]

[tool.coverage.run]
branch = true
source = ["fastapi_nacos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict = false
